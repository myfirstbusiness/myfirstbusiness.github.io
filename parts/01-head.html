     the moment the questionnaire opens, not on page load — first paint stays
     around 200KB, which matters on a phone on mobile data. -->
<style>
/* Fonts are self-hosted (latin subsets, ~105KB total). No Google Fonts
   request, no third-party call anywhere on this page — which is what lets
   the site honestly claim nothing leaves the visitor's device. */
@font-face{font-family:'Archivo';src:url('fonts/archivo.woff2') format('woff2-variations');font-weight:100 900;font-display:swap}
@font-face{font-family:'Inter';src:url('fonts/inter.woff2') format('woff2-variations');font-weight:100 900;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('fonts/mono.woff2') format('woff2');font-weight:400 700;font-display:swap}

/* ============================================================
   MYFIRSTBUSINESS — DESIGN SYSTEM
   Palette rationale (see BRAND-AND-STRATEGY.md):
   - Near-black base: maximum contrast headroom, lets ONE accent
     own attention (Von Restorff / isolation effect).
   - Volt (#C8FF3C) is reserved EXCLUSIVELY for primary actions.
     It appears nowhere else. That is the whole point.
   - Ember (#FF6B2C) for emphasis/urgency, used sparingly.
   - Credibility comes from data, typography and whitespace,
     not from "trust blue".
   ============================================================ */
:root{
  --ink:#05070C; --ink-2:#0A0E16; --ink-3:#111828; --ink-4:#182033;
  --line:#1E2839; --line-2:#2B3548;
  --text:#EAEEF5; --text-2:#98A4B8; --text-3:#616D80;
  --volt:#C8FF3C; --volt-2:#A8E01E; --volt-ink:#08120A;
  --ember:#FF6B2C; --sky:#63A8FF; --good:#3DDC97;
  --r-sm:8px; --r:14px; --r-lg:22px; --r-xl:32px;
  --maxw:1140px;
  --f-display:'Archivo','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif;
  --f-body:'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--ink);color:var(--text);font-family:var(--f-body);
  font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body.locked{overflow:hidden}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:var(--volt);color:var(--volt-ink)}

/* ---------- type ---------- */
h1,h2,h3,h4{font-family:var(--f-display);font-weight:800;line-height:1.04;letter-spacing:-.03em}
.h-xl{font-size:clamp(2.9rem,7.2vw,5.4rem);font-weight:900;letter-spacing:-.045em}
.h-lg{font-size:clamp(2.1rem,4.6vw,3.5rem);font-weight:900;letter-spacing:-.04em}
.h-md{font-size:clamp(1.5rem,2.8vw,2.15rem)}
.h-sm{font-size:1.2rem;letter-spacing:-.02em}
.lede{font-size:clamp(1.08rem,1.9vw,1.32rem);color:var(--text-2);line-height:1.6;max-width:60ch}
.mono{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.dim{color:var(--text-2)}
.dim3{color:var(--text-3)}
.vlt{color:var(--volt)}
.emb{color:var(--ember)}

/* ---------- layout ---------- */
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:24px}
section{padding-block:clamp(72px,10vw,132px);position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:9px;color:var(--text-3);margin-bottom:20px}
.eyebrow::before{content:"";width:26px;height:1px;background:var(--line)}
.grid{display:grid;gap:22px}
.hr{height:1px;background:var(--line);border:0}

/* ---------- nav ---------- */
header.nav{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--ink) 82%,transparent);
  backdrop-filter:blur(18px) saturate(140%);
  border-bottom:1px solid transparent;transition:border-color .3s
}
header.nav.stuck{border-bottom-color:var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:70px}
.logo{display:flex;align-items:center;gap:11px;font-family:var(--f-display);font-weight:900;font-size:1.03rem;letter-spacing:-.035em}
.logo-mark{width:30px;height:30px;border-radius:9px;background:var(--volt);color:var(--volt-ink);display:grid;place-items:center;font-size:1rem;font-weight:900;flex:none}
.nav-links{display:flex;gap:30px;align-items:center}
.nav-links a{font-size:.93rem;color:var(--text-2);transition:color .18s}
.nav-links a:hover{color:var(--text)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:16px 26px;border-radius:999px;font-weight:700;font-size:1rem;
  letter-spacing:-.01em;transition:transform .16s var(--ease),box-shadow .2s,background .2s;
  min-height:52px;white-space:nowrap;
}
.btn-primary{background:var(--volt);color:var(--volt-ink);box-shadow:0 0 0 0 rgba(200,255,60,.4)}
@media(hover:hover){.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 40px -12px rgba(200,255,60,.55)}}
.btn-primary:active{transform:translateY(0)}
.btn-lg{padding:20px 34px;font-size:1.08rem;min-height:62px}
.btn-ghost{border:1px solid var(--line);color:var(--text-2)}
@media(hover:hover){.btn-ghost:hover{border-color:var(--text-3);color:var(--text)}}
.btn:disabled{opacity:.32;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn-arrow{font-family:var(--f-mono);font-size:1.05em}

/* ---------- hero ---------- */
.hero{padding-top:clamp(56px,8vw,92px);padding-bottom:clamp(56px,7vw,96px);overflow:hidden}
.hero::before{
  content:"";position:absolute;inset:-30% -10% auto -10%;height:80vh;pointer-events:none;
  background:radial-gradient(52% 46% at 50% 30%,rgba(200,255,60,.10),transparent 68%);
}
.hero-in{position:relative;z-index:1;max-width:920px}
.badge{
  display:inline-flex;align-items:center;gap:10px;padding:7px 15px 7px 9px;border-radius:999px;
  border:1px solid var(--line);background:var(--ink-2);font-size:.8rem;color:var(--text-2);margin-bottom:26px
}
.badge b{color:var(--volt);font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--volt);box-shadow:0 0 0 4px rgba(200,255,60,.16);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero h1{margin-bottom:24px}
.hero h1 em{font-style:normal;color:var(--volt)}
.hero .lede{margin-bottom:34px;font-size:clamp(1.12rem,2vw,1.4rem)}
.cta-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:26px}
.cta-note{font-size:.9rem;color:var(--text-3)}
.trust-row{display:flex;flex-wrap:wrap;gap:10px 22px;padding-top:26px;border-top:1px solid var(--line)}
.trust-item{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--text-2)}
.tick{width:16px;height:16px;flex:none;color:var(--volt)}

/* ---------- stat strip ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-block:1px solid var(--line)}
.stat{background:var(--ink);padding:30px 22px}
.stat b{display:block;font-family:var(--f-display);font-size:clamp(1.8rem,3.4vw,2.6rem);font-weight:900;letter-spacing:-.04em;line-height:1;margin-bottom:8px}
.stat span{font-size:.85rem;color:var(--text-2);line-height:1.45;display:block}
.stat small{display:block;margin-top:7px;font-size:.7rem;color:var(--text-3)}

/* ---------- cards ---------- */
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:30px}
.card-num{font-family:var(--f-mono);font-size:.72rem;color:var(--volt);letter-spacing:.16em;margin-bottom:16px;display:block}
.card h3{margin-bottom:10px;font-size:1.18rem}
.card p{font-size:.96rem;color:var(--text-2);line-height:1.6}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}

/* ---------- problem list ---------- */
.pain{display:grid;gap:14px;margin-top:34px}
.pain-item{display:flex;gap:16px;align-items:flex-start;padding:20px 22px;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);border-left:2px solid var(--ember)}
.pain-item span:first-child{font-family:var(--f-mono);color:var(--ember);font-size:.78rem;padding-top:3px;flex:none}
.pain-item p{color:var(--text-2);font-size:.98rem}
.pain-item p b{color:var(--text);font-weight:600}

/* ---------- pdf anatomy ---------- */
.anatomy{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center}
.doc-mock{
  background:linear-gradient(160deg,var(--ink-3),var(--ink-2));border:1px solid var(--line);
  border-radius:var(--r-lg);padding:34px 30px;position:relative;overflow:hidden;
  box-shadow:0 40px 80px -40px rgba(0,0,0,.9)
}
.doc-mock::after{content:"";position:absolute;inset:auto -20% -60% -20%;height:60%;background:radial-gradient(50% 100% at 50% 100%,rgba(200,255,60,.14),transparent 70%)}
.doc-tag{font-family:var(--f-mono);font-size:.64rem;color:var(--volt);letter-spacing:.2em;margin-bottom:18px}
.doc-title{font-family:var(--f-display);font-weight:900;font-size:1.9rem;letter-spacing:-.04em;line-height:1.05;margin-bottom:14px}
.doc-sub{font-size:.85rem;color:var(--text-2);margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.doc-line{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line);font-size:.84rem}
.doc-line:last-child{border:0}
.doc-line span:first-child{color:var(--text-2)}
.doc-line span:last-child{font-family:var(--f-mono);font-size:.7rem;color:var(--text-3)}
.chapter-list{display:grid;gap:2px}
.chapter{display:flex;gap:18px;padding:15px 0;border-bottom:1px solid var(--line);align-items:baseline}
.chapter:last-child{border:0}
.chapter b{font-family:var(--f-mono);font-size:.7rem;color:var(--volt);flex:none;width:26px}
.chapter div strong{display:block;font-weight:600;font-size:1rem;margin-bottom:3px}
.chapter div span{font-size:.9rem;color:var(--text-2);line-height:1.5}

/* ---------- steps ---------- */
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:44px}
.step{position:relative;padding-top:30px;border-top:2px solid var(--line)}
.step::before{
  counter-increment:s;content:"0" counter(s);position:absolute;top:-1px;left:0;
  transform:translateY(-50%);background:var(--ink);padding-right:14px;
  font-family:var(--f-mono);font-weight:700;font-size:.78rem;color:var(--volt)
}
.step h3{font-size:1.24rem;margin-bottom:9px}
.step p{color:var(--text-2);font-size:.96rem}

/* ---------- method ---------- */
.method{background:var(--ink-2);border-block:1px solid var(--line)}
.laws{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-top:40px}
.law{background:var(--ink-2);padding:24px 22px;transition:background .2s}
@media(hover:hover){.law:hover{background:var(--ink-3)}}
.law b{font-family:var(--f-mono);font-size:.66rem;color:var(--volt);letter-spacing:.14em;display:block;margin-bottom:10px}
.law p{font-size:.94rem;line-height:1.5;font-weight:500}
.source-note{margin-top:26px;font-size:.85rem;color:var(--text-3);max-width:66ch}

/* ---------- faq ---------- */
.faq{display:grid;gap:0;margin-top:36px;border-top:1px solid var(--line)}
details{border-bottom:1px solid var(--line)}
summary{padding:24px 0;font-weight:600;font-size:1.05rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:20px;align-items:center;transition:color .18s}
summary:hover{color:var(--volt)}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--f-mono);color:var(--volt);font-size:1.3rem;flex:none;transition:transform .25s}
details[open] summary::after{transform:rotate(45deg)}
details p{padding-bottom:24px;color:var(--text-2);font-size:.98rem;max-width:72ch}

/* ---------- final cta ---------- */
.final{text-align:center}
.final .wrap{max-width:760px}
.final h2{margin-bottom:20px}
.final .lede{margin:0 auto 32px}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);padding-block:44px;font-size:.88rem;color:var(--text-3)}
.foot-in{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center}
.foot-links{display:flex;gap:22px;flex-wrap:wrap}
.foot-links a:hover{color:var(--text)}

/* ============================================================
   QUIZ
   ============================================================ */
.quiz{position:fixed;inset:0;z-index:200;background:var(--ink);display:none;flex-direction:column}
.quiz.open{display:flex}
.quiz-top{border-bottom:1px solid var(--line);flex:none}
.quiz-top-in{display:flex;align-items:center;justify-content:space-between;height:64px;gap:18px}
.q-count{font-family:var(--f-mono);font-size:.72rem;color:var(--text-3);letter-spacing:.14em;white-space:nowrap}
.q-step{display:none;font-size:.84rem;color:var(--text-3)}
.q-close{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--text-2);transition:.18s;flex:none}
.q-close:hover{border-color:var(--ember);color:var(--ember)}
.prog{height:2px;background:var(--line);position:relative}
.prog-bar{position:absolute;inset:0 auto 0 0;width:0;background:var(--volt);transition:width .45s var(--ease)}
.quiz-body{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.quiz-stage{flex:1;display:flex;align-items:center;padding-block:clamp(30px,6vw,64px)}
.q-card{width:100%;max-width:820px;margin-inline:auto;padding-inline:24px;animation:qin .42s var(--ease)}
@keyframes qin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.q-kicker{font-family:var(--f-mono);font-size:.68rem;color:var(--volt);letter-spacing:.18em;margin-bottom:16px}
.q-title{font-family:var(--f-display);font-weight:900;font-size:clamp(1.7rem,4.2vw,2.7rem);letter-spacing:-.04em;line-height:1.08;margin-bottom:12px}
.q-help{color:var(--text-2);font-size:1rem;margin-bottom:32px}
.opts{display:grid;gap:11px}
.opts.two{grid-template-columns:repeat(2,1fr)}
.opt{
  display:flex;align-items:flex-start;gap:15px;text-align:left;width:100%;
  padding:16px 20px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--ink-2);transition:border-color .16s,background .16s,transform .16s var(--ease)
}
@media(hover:hover){.opt:hover{border-color:var(--text-3);background:var(--ink-3);transform:translateX(3px)}}
.opt.sel{border-color:var(--volt);background:rgba(200,255,60,.07)}
.opt-key{
  width:26px;height:26px;border-radius:7px;border:1px solid var(--line);flex:none;
  display:grid;place-items:center;font-family:var(--f-mono);font-size:.7rem;color:var(--text-3);
  margin-top:1px;transition:.16s
}
.opt.sel .opt-key{background:var(--volt);border-color:var(--volt);color:var(--volt-ink)}
.opt-txt strong{display:block;font-weight:600;font-size:1rem;line-height:1.35;margin-bottom:3px}
.opt-txt span{font-size:.88rem;color:var(--text-2);line-height:1.45}
/* free-text question */
.q-input{
  width:100%;font-family:var(--f-body);font-size:1.15rem;color:var(--text);
  background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 22px;transition:border-color .18s,background .18s;line-height:1.5;
}
.q-input::placeholder{color:var(--text-3)}
.q-input:focus{outline:none;border-color:var(--volt);background:var(--ink-3)}
.q-meta{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:14px;flex-wrap:wrap}
.q-count-chars{font-family:var(--f-mono);font-size:.7rem;color:var(--text-3);letter-spacing:.1em}
.q-skip{font-size:.92rem;color:var(--text-3);text-decoration:underline;text-underline-offset:3px;transition:color .18s}
.q-skip:hover{color:var(--ember)}

.q-foot{flex:none;border-top:1px solid var(--line);background:var(--ink)}
.q-foot-in{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:16px;min-height:78px}
.q-hint{font-size:.82rem;color:var(--text-3)}
.q-hint kbd{font-family:var(--f-mono);font-size:.72rem;background:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--text-2)}
.q-back{font-size:.92rem;color:var(--text-3);transition:color .18s}
.q-back:hover{color:var(--text)}

/* ---------- building screen ---------- */
.building{max-width:620px;margin:auto;padding:60px 24px;text-align:center}
.build-ring{width:76px;height:76px;margin:0 auto 30px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--volt);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.build-log{margin-top:30px;text-align:left;display:grid;gap:9px;font-family:var(--f-mono);font-size:.78rem}
.build-log div{color:var(--text-3);opacity:.3;transition:.4s}
.build-log div.on{opacity:1;color:var(--text-2)}
.build-log div.on::before{content:"✓ ";color:var(--volt)}

/* ---------- results ---------- */
.results{max-width:900px;margin-inline:auto;padding:clamp(34px,6vw,64px) 24px 90px;animation:qin .5s var(--ease)}
.res-hero{text-align:center;margin-bottom:44px}
.res-label{font-family:var(--f-mono);font-size:.7rem;color:var(--text-3);letter-spacing:.2em;margin-bottom:18px}
.res-name{font-family:var(--f-display);font-weight:900;font-size:clamp(2.2rem,6vw,3.8rem);letter-spacing:-.045em;line-height:1.02;color:var(--volt);margin-bottom:18px}
.res-why{color:var(--text-2);font-size:1.08rem;max-width:62ch;margin-inline:auto}
.res-fit{display:inline-flex;align-items:center;gap:12px;margin-top:24px;padding:9px 18px;border:1px solid var(--line);border-radius:999px;font-size:.86rem}
.res-fit b{font-family:var(--f-mono);color:var(--volt)}
.res-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:36px}
.res-box{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.res-box .mono{color:var(--text-3);margin-bottom:12px;display:block}
.res-box ul{list-style:none;display:grid;gap:9px}
.res-box li{font-size:.94rem;color:var(--text-2);padding-left:18px;position:relative;line-height:1.5}
.res-box li::before{content:"→";position:absolute;left:0;color:var(--volt);font-family:var(--f-mono);font-size:.8rem}
.res-dl{background:linear-gradient(150deg,var(--ink-3),var(--ink-2));border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(28px,5vw,42px);text-align:center;position:relative;overflow:hidden}
.res-dl::before{content:"";position:absolute;inset:-50% -10% auto -10%;height:120%;background:radial-gradient(50% 50% at 50% 40%,rgba(200,255,60,.12),transparent 70%);pointer-events:none}
.res-dl > *{position:relative}
.res-dl h3{font-size:clamp(1.4rem,3vw,2rem);margin-bottom:12px}
.res-dl p{color:var(--text-2);margin-bottom:26px;max-width:52ch;margin-inline:auto;font-size:.98rem}
.res-alt{margin-top:34px}
.alt-item{display:flex;gap:16px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line)}
.alt-item b{font-family:var(--f-mono);font-size:.7rem;color:var(--text-3);flex:none;width:34px}
.alt-item div strong{display:block;font-size:1rem;font-weight:600;margin-bottom:3px}
.alt-item div span{font-size:.9rem;color:var(--text-2)}
.res-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:34px}

/* ---------- toast ---------- */
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,180%);opacity:0;pointer-events:none;background:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:13px 24px;font-size:.9rem;z-index:300;transition:transform .4s var(--ease),opacity .3s;box-shadow:0 20px 50px -20px #000}
.toast.show{transform:translate(-50%,0);opacity:1}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}

/* ---------- responsive ---------- */
@media(max-width:980px){
  .anatomy{grid-template-columns:1fr;gap:36px}

}
